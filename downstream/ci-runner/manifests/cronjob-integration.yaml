apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-sandbox-nightly-integration
  namespace: agent-sandbox-ci
  labels:
    app.kubernetes.io/name: agent-sandbox-ci
    app.kubernetes.io/component: integration
spec:
  schedule: "0 2 * * 6"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agent-sandbox-ci
            app.kubernetes.io/component: integration
        spec:
          serviceAccountName: ci-runner
          restartPolicy: Never
          containers:
          - name: ci-runner
            image: quay.io/jensfr/agent-sandbox-ci-runner:latest
            imagePullPolicy: Always
            args: ["integration"]
            env:
            - name: OPENSHELL_IMAGE_TAG
              value: "latest"
            - name: KATA_RPM_VERSION
              value: "latest"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-credentials
                  key: webhook-url
                  optional: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
