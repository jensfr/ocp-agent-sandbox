# Optional: Slack webhook URL for notifications.
# Create yours at https://api.slack.com/apps → Incoming Webhooks.
# Then: oc create secret generic slack-credentials -n agent-sandbox-ci \
#         --from-literal=webhook-url='https://hooks.slack.com/services/T.../B.../...'
#
# Without this secret, the CronJob still runs — results are in pod logs only.
apiVersion: v1
kind: Secret
metadata:
  name: slack-credentials
  namespace: agent-sandbox-ci
type: Opaque
stringData:
  webhook-url: ""
