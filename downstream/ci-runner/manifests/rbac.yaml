apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-runner
  namespace: agent-sandbox-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-ci-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: ci-runner
  namespace: agent-sandbox-ci
