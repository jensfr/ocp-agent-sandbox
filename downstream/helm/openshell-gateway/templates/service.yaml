apiVersion: v1
kind: Service
metadata:
  name: openshell-gateway
  namespace: {{ include "openshell-gateway.namespace" . }}
  labels:
    {{- include "openshell-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "openshell-gateway.selectorLabels" . | nindent 4 }}
  ports:
  - name: grpc
    port: 8443
    targetPort: grpc
    protocol: TCP
