{{- if .Values.serviceAccounts.gateway.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.gateway.name }}
  namespace: {{ include "openshell-gateway.namespace" . }}
  labels:
    {{- include "openshell-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- end }}
---
{{- if .Values.serviceAccounts.sandbox.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.sandbox.name }}
  namespace: {{ include "openshell-gateway.namespace" . }}
  labels:
    {{- include "openshell-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
{{- end }}
